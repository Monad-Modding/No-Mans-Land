modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com/Alchemists-Of-Yore/No-Mans-Land/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
logoFile="${mod_id}.png"
#credits=""
authors="${mod_authors}"
description='''${mod_description}'''
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="mixed_litter"
    type="required"
    reason="Required for mob variants"
    versionRange="${mixed_litter_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="blueprint"
    type="required"
    reason="Required for world generation"
    versionRange="${blueprint_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="terrablender"
    type="discouraged"
    reason="Terrablender will break some of our biomes especially the Caves biome"
    versionRange=""
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="create"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="farmersdelight"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="blockbox"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="nirvana"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="boatload"
    type="optional"
    ordering="AFTER"
    side="BOTH"