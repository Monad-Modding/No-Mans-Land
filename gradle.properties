mod.description=A vanilla-friendly overhaul that improves your Overworld, enhancing biomes and adding new ones alike - transforming the world with _great care to detail_ in every one of its aspects. From the tallest mountain peaks to the deepest of oceanic trenches, No Man's Land seeks to bring every single environment to the same level of quality and care. This mod is, at its core, supposed to enhance your Gameplay, and as such has all of its features designed to be greatly interactive and allowing of creative freedom. Everything in creation is blessed by beauty, and You are an inseparable part of it. So explore, and love as this world loves you.

